version: 3
projects:
  - name: dev
    dir: environments/dev
    workspace: default
    workflow: dev
    autoplan:
      when_modified:
        - "*.tf"
        - "../../modules/**/*.tf"
      enabled: true

workflows:
  dev:
    plan:
      steps:
        - init:
            extra_args: ["-backend-config=backend.hcl"]
        - plan
    apply:
      steps:
        - apply